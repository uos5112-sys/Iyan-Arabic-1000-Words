<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>암미야 1000 — 이집트 방언 단어 게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Naskh+Arabic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e7eeec; --surface:#fbfcfb; --surface2:#f1f5f4; --ink:#14234a; --muted:#5b6782; --line:#cfdbd8;
  --gold:#b8861c; --gold-soft:#f5e8c4; --teal:#1d827d; --teal-soft:#d9efed;
  --good:#1f7a4a; --good-soft:#dcf1e4; --bad:#b03d2a; --bad-soft:#f7e0da;
  --shadow:0 1px 2px rgba(20,35,74,.06),0 8px 24px rgba(20,35,74,.08);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1830; --surface:#152346; --surface2:#1b2b54; --ink:#efe8d6; --muted:#a3adc6; --line:#2a3c6b;
    --gold:#e6ba50; --gold-soft:#3a3320; --teal:#52c4bb; --teal-soft:#173e45;
    --good:#5ccb8b; --good-soft:#17392a; --bad:#ec806b; --bad-soft:#40211c;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1830; --surface:#152346; --surface2:#1b2b54; --ink:#efe8d6; --muted:#a3adc6; --line:#2a3c6b;
  --gold:#e6ba50; --gold-soft:#3a3320; --teal:#52c4bb; --teal-soft:#173e45;
  --good:#5ccb8b; --good-soft:#17392a; --bad:#ec806b; --bad-soft:#40211c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.ar{font-family:"Noto Naskh Arabic","Geeza Pro","Damascus","Arial",serif;direction:rtl;unicode-bidi:isolate;font-weight:700}
.serif{font-family:"Gowun Batang",Georgia,serif}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 56px}

/* hero */
.hero{padding:18px 0 8px}
.hero h1{font-size:clamp(34px,8vw,48px);line-height:1.1;margin:0;letter-spacing:-.01em}
.hero h1 .ar{color:var(--gold);font-size:.8em;margin-inline-start:10px}
.hero p{margin:8px 0 0;color:var(--muted);max-width:34em}
.meter{display:flex;gap:20px;flex-wrap:wrap;margin:18px 0 0;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.meter div{display:flex;align-items:baseline;gap:6px}
.meter b{font-size:22px;font-family:"Gowun Batang",Georgia,serif}
.meter span{color:var(--muted);font-size:14px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}

.btn{border:1.5px solid var(--line);background:var(--surface);padding:11px 16px;border-radius:12px;font-weight:600;transition:transform .08s,background .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.gold{background:var(--gold);color:#1b1503;border-color:var(--gold)}
.btn:disabled{opacity:.45}

/* tabs */
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:26px 0 6px;background:var(--surface2);padding:5px;border-radius:14px}
@media (min-width:640px){.tabs{grid-template-columns:repeat(10,1fr)}}
.tab.full small{color:var(--gold)}
.dayinfo{margin:0 0 12px;color:var(--muted);font-size:13px}
.tab{border:0;background:transparent;padding:8px 2px;font-size:14px;border-radius:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.tab small{font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
.tab.on{background:var(--surface);box-shadow:var(--shadow)}

/* unit list */
.units{display:flex;flex-direction:column;gap:10px}
.unit{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.unit:hover{border-color:var(--teal)}
.u-no{grid-row:span 2;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--teal-soft);color:var(--teal)}
.u-no.done{background:var(--gold);color:#1b1503}
.u-title{font-size:18px;font-weight:700}
.u-sub{color:var(--muted);font-size:13px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.u-sub .ar{font-size:16px;color:var(--ink);font-weight:500}
.u-stars{grid-row:span 2;text-align:end;font-size:13px;color:var(--muted);white-space:nowrap}
.u-stars b{display:block;color:var(--gold);font-size:17px}
.dots{display:flex;gap:3px;justify-content:flex-end;margin-top:4px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.d1{background:var(--teal)} .dots i.d2{background:var(--gold)} .dots i.d3{background:var(--good)}

/* unit screen */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.back{border:0;background:transparent;color:var(--muted);font-weight:600;padding:8px 2px}
.unit-head h2{font-size:28px;margin:4px 0 2px;line-height:1.2}
.unit-head p{margin:0;color:var(--muted)}
.path{list-style:none;margin:22px 0 0;padding:0;position:relative}
.path::before{content:"";position:absolute;inset-inline-start:23px;top:24px;bottom:24px;width:2px;background:var(--line)}
.stage{position:relative;display:grid;grid-template-columns:48px 1fr auto;gap:14px;align-items:center;width:100%;text-align:start;background:transparent;border:0;padding:10px 0}
.stage .s-num{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:var(--surface);border:2px solid var(--teal);z-index:1}
.stage.cleared .s-num{border-color:var(--gold);background:var(--gold-soft)}
.stage.locked .s-num{border-color:var(--line);filter:grayscale(1);opacity:.6}
.stage .s-txt b{display:block;font-size:17px}
.stage .s-txt small{color:var(--muted);font-size:13px}
.stage.locked .s-txt{opacity:.55}
.stage .s-st{color:var(--gold);letter-spacing:1px;font-size:15px}
.stage:not(:disabled):hover .s-num{transform:scale(1.06)}
.wordlist{margin-top:26px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 14px}
.wordlist summary{padding:12px 0;font-weight:700;cursor:pointer}
.wr{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.wr-n{color:var(--muted);font-size:13px}
.wr-ar{font-size:24px;line-height:1.6}
.wr-m{display:block;font-weight:600}
.wr-p{display:block;color:var(--muted);font-size:13px}
.say{border:1px solid var(--line);background:var(--surface2);border-radius:50%;width:38px;height:38px;font-size:16px;flex:none}

/* play */
.prog{flex:1;height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--teal);transition:width .3s}
.prog.time i{background:var(--gold);transition:width .1s linear}
.count{font-size:14px;color:var(--muted);min-width:52px;text-align:end;font-variant-numeric:tabular-nums}
.ptitle{font-family:"Gowun Batang",Georgia,serif;font-weight:700;font-size:18px;margin:6px 0 16px}

/* cartouche — the signature element */
.cartouche{position:relative;margin:0 auto;max-width:520px;border:3px solid var(--gold);border-radius:999px;padding:22px 40px;background:var(--surface);text-align:center;box-shadow:var(--shadow)}
.cartouche::after{content:"";position:absolute;inset-inline-end:-14px;top:18%;bottom:18%;width:6px;border-radius:3px;background:var(--gold)}
.cartouche .ar{font-size:clamp(40px,11vw,64px);line-height:1.5;display:block}
.cartouche .ko{font-family:"Gowun Batang",Georgia,serif;font-size:clamp(24px,6vw,32px);font-weight:700;display:block;line-height:1.35}
.cartouche .en{display:block;color:var(--muted);font-size:14px;margin-top:4px}
.qlabel{text-align:center;color:var(--muted);margin:0 0 12px;font-size:15px}
.sayrow{display:flex;justify-content:center;margin:12px 0 0}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
@media (max-width:460px){.opts{grid-template-columns:1fr}}
.opt{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px 12px;min-height:62px;text-align:center;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
.opt .k{position:absolute;inset-inline-start:10px;top:8px;font-size:11px;color:var(--muted);font-weight:400}
.opt .ar{font-size:30px;line-height:1.5}
.opt small{color:var(--muted);font-weight:400;font-size:13px}
.opt:not(:disabled):hover{border-color:var(--teal)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}

.reveal{margin-top:16px;border-radius:14px;padding:12px 16px;border:1.5px solid}
.reveal.good{border-color:var(--good);background:var(--good-soft)}
.reveal.bad{border-color:var(--bad);background:var(--bad-soft)}
.reveal .rv-h{font-weight:700}
.reveal .rv-w{margin-top:4px}
.reveal .rv-w .ar{font-size:22px;margin-inline-end:6px}
.reveal .rv-ex{color:var(--muted);font-size:14px;margin-top:4px}
.nextrow{display:flex;justify-content:flex-end;margin-top:12px}

/* flashcard */
.flash{perspective:1200px;max-width:520px;margin:0 auto;height:340px;cursor:pointer}
.flash-in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flash.on .flash-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:28px;background:var(--surface);border:3px solid var(--gold);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center;overflow:auto}
.face.back{transform:rotateY(180deg);border-color:var(--teal)}
.face .ar.big{font-size:clamp(48px,13vw,76px);line-height:1.5}
.face .ar.mid{font-size:34px;line-height:1.5}
.face .hint{color:var(--muted);font-size:13px;margin-top:10px}
.face .pron{font-weight:700;font-size:20px}
.face .pron span{display:block;font-weight:400;color:var(--muted);font-size:16px}
.face .mean{font-family:"Gowun Batang",Georgia,serif;font-size:24px;font-weight:700;margin-top:8px}
.face .en{color:var(--muted);font-size:14px}
.face .ex{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:14px;width:100%}
.face .ex-r{font-weight:600}
.face .ex-k{color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:520px;margin:16px auto 0}
.kbd{text-align:center;color:var(--muted);font-size:12px;margin-top:12px}
@media (hover:none){.kbd{display:none}}

/* match */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.mcol{display:flex;flex-direction:column;gap:10px}
.mi{background:var(--surface);border:2px solid var(--line);border-radius:14px;min-height:64px;padding:8px 10px;font-weight:600;transition:opacity .25s,transform .25s}
.mi .ar{font-size:26px;line-height:1.5}
.mi.sel{border-color:var(--teal);background:var(--teal-soft)}
.mi.ok{border-color:var(--good);background:var(--good-soft);opacity:.35;transform:scale(.96)}
.mi.no{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* result */
.result{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:28px 20px;box-shadow:var(--shadow)}
.r-title{font-size:24px;font-weight:700;margin:0}
.r-stars{font-size:46px;letter-spacing:6px;margin:10px 0 0;color:var(--line)}
.r-stars .on{color:var(--gold)}
.r-score{font-size:18px;font-weight:700;margin-top:6px}
.r-msg{color:var(--muted);margin:6px 0 18px}
.r-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.missed{margin-top:22px;text-align:start;border-top:1px solid var(--line)}
.missed h4{margin:14px 0 4px;font-size:15px}

.voicebox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:16px;color:var(--muted)}
.voicebox h3{margin:0 0 6px;font-size:17px;color:var(--ink)}
.vs{margin:0 0 10px;color:var(--ink);font-weight:600}
.vs.ok{color:var(--good)}
.vrow{display:flex;gap:8px;align-items:center;margin-bottom:10px;color:var(--ink)}
.vrow select{flex:1;min-width:0;padding:9px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface2);color:var(--ink);font:inherit}
.vrow input{flex:1}
.vnote{margin:0}
footer{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
footer p{margin:0 0 8px}
.linkbtn{border:0;background:transparent;color:var(--bad);text-decoration:underline;padding:0;font-size:13px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<main class="wrap" id="app"></main>

 3:["의문사와 상황 표현","사람·가족 호칭","시간과 일과","일상 동작 동사","감각·상태 형용사"],

 13:["신체 외모·얼굴 부위 및 이발소·미용실 표현", "옷장 부속·액세서리 및 가방 속 패션 소품", "일상 제10의 필수 동작 동사", "쇼핑 품질·상태 및 상업 거래 표현", "이집트 일상 속 깊은 문화적 기원과 축복 관용구"],

/* storage */
const SKEY='ammiya200-v1';
let store={stars:{},wrong:{},best:{},day:1};
try{const s=JSON.parse(localStorage.getItem(SKEY)||'null'); if(s&&s.stars)store=Object.assign(store,s);}catch(e){}
function save(){try{localStorage.setItem(SKEY,JSON.stringify(store))}catch(e){}}
const getStars=k=>store.stars[k]||[0,0,0,0,0,0];
function setStar(k,i,s){const a=getStars(k).slice(); if(s>a[i])a[i]=s; store.stars[k]=a; save();}
const unlocked=(k,i)=>i===0||getStars(k)[i-1]>0;
function addWrong(id){store.wrong[id]=(store.wrong[id]||0)+1; save();}

/* speech */
const canSpeak='speechSynthesis' in window;
let arVoice=null, arVoices=[];
const isEG=v=>/ar[-_]EG/i.test(v.lang)||/egypt|مصر|salma|shakir/i.test(v.name);
function pickVoice(){try{
  arVoices=speechSynthesis.getVoices().filter(v=>/^ar/i.test(v.lang));
  const natural=v=>/natural|online|neural/i.test(v.name)?1:0;
  arVoice=arVoices.find(v=>v.voiceURI===store.voice)
    ||arVoices.filter(isEG).sort((a,b)=>natural(b)-natural(a))[0]
    ||arVoices[0]||null;
  if(document.getElementById('voicebox'))renderVoiceBox();
}catch(e){}}
if(canSpeak){pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; setTimeout(pickVoice,800);}
// 이집트식으로 읽히도록 글자 치환: ق → 끊어 읽기(ء), ث → ت, ذ → د
function egyptize(t){
  return t.replace(/\s*\/\s*/g,'، ').replace(/ق/g,'ء').replace(/ث/g,'ت').replace(/ذ/g,'د');
}
function speak(text){
  if(!canSpeak)return;
  try{const u=new SpeechSynthesisUtterance(egyptize(text));u.lang=arVoice?arVoice.lang:'ar-EG';if(arVoice)u.voice=arVoice;u.rate=store.rate||.8;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}
}
function renderVoiceBox(){
  const box=document.getElementById('voicebox'); if(!box)return;
  if(!canSpeak){box.innerHTML='<h3 class="serif">발음 음성</h3><p class="vnote">이 브라우저는 음성 재생을 지원하지 않아요.</p>';return;}
  const eg=arVoices.filter(isEG), usingEG=arVoice&&isEG(arVoice);
  const status=!arVoices.length?'이 기기에서 아랍어 음성을 찾지 못했어요.':usingEG?`이집트 음성으로 재생 중: ${arVoice.name}`:`이집트 음성이 없어 ${arVoice.name} 음성으로 재생해요.`;
  box.innerHTML=`<h3 class="serif">발음 음성</h3>
    <p class="vs ${usingEG?'ok':''}">${esc(status)}</p>
    ${arVoices.length?`<div class="vrow"><select id="vsel" aria-label="음성 선택">${arVoices.map(v=>`<option value="${esc(v.voiceURI)}" ${arVoice&&v.voiceURI===arVoice.voiceURI?'selected':''}>${isEG(v)?'🇪🇬 ':''}${esc(v.name)} (${esc(v.lang)})</option>`).join('')}</select><button class="btn" id="vtest">들어 보기</button></div>
    <label class="vrow">속도 <input type="range" id="vrate" min="0.5" max="1.1" step="0.05" value="${store.rate||0.8}"></label>`:''}
    <p class="vnote">어떤 음성이든 ق는 이집트식 끊어 읽기(')로, ث는 ‘ㅌ’으로 읽히도록 바꿔서 재생해요. ${usingEG?'ج도 이집트식 ‘ㄱ(g)’로 읽힙니다.':(eg.length?'목록에서 🇪🇬 표시된 음성을 고르면 ج도 ‘ㄱ(g)’로 읽혀요.':'ج를 ‘ㄱ(g)’로 읽는 건 이집트 음성에서만 가능해요. PC에서 Microsoft Edge 브라우저로 이 페이지를 열면 이집트 음성(Salma, Shakir)이 목록에 나타나요.')}</p>`;
  const sel=document.getElementById('vsel');
  if(sel)sel.onchange=()=>{store.voice=sel.value;save();arVoice=arVoices.find(v=>v.voiceURI===sel.value)||arVoice;renderVoiceBox();speak('أَهْلًا، إِزَّيَّك؟');};
  const t=document.getElementById('vtest');
  if(t)t.onclick=()=>speak('أَهْلًا، إِزَّيَّك؟ أَنَا كُوَيِّس. عَايِز قَهْوَة وِ مَيَّة.');
  const r=document.getElementById('vrate');
  if(r)r.oninput=()=>{store.rate=+r.value;save();};
}

  let total=0, doneUnits=0;
  for(const d of DAYS)for(let u=1;u<=5;u++){const s=getStars(`${d}-${u}`);total+=s.reduce((a,b)=>a+b,0);if(s.every(x=>x>0))doneUnits++;}
  const wrongN=Object.keys(store.wrong).length;
  let h=`<section class="hero">
    <h1 class="serif">암미야 1000<span class="ar">عامية</span></h1>
    <p>이집트 방언 실생활 단어 1,000개(Day 1–20)를 단원마다 6단계 게임으로 외워요. 앞 단계에서 별을 1개 이상 받으면 다음 단계가 열립니다.</p>
    <div class="meter">
      <div><b>${total}</b><span>/ ${DAYS.length*90} 별</span></div>
      <div><b>${doneUnits}</b><span>/ ${DAYS.length*5} 단원 완주</span></div>
      <div><b>${wrongN}</b><span>복습할 단어</span></div>
    </div>
    <div class="actions">
      <button class="btn primary" id="rv" ${wrongN?'':'disabled'}>틀린 단어 복습하기</button>
      <button class="btn" id="mix">전체 랜덤 20문제</button>
    </div>
  </section>
  <nav class="tabs" aria-label="Day 선택">${DAYS.map(d=>{let s=0;for(let u=1;u<=5;u++)s+=getStars(`${d}-${u}`).reduce((a,b)=>a+b,0);return `<button class="tab ${d===curDay?'on':''} ${s>=90?'full':''}" data-day="${d}" aria-pressed="${d===curDay}" title="${(d-1)*50+1}–${d*50}번">Day ${d}<small>${s?'★ '+s:(d-1)*50+1+'–'}</small></button>`}).join('')}</nav>
  <p class="dayinfo">Day ${curDay}: ${(curDay-1)*50+1}–${curDay*50}번</p>
  <div class="units">`;
  for(let u=1;u<=5;u++){
    const k=`${curDay}-${u}`, st=getStars(k), s=st.reduce((a,b)=>a+b,0), ws=unitWords(curDay,u), done=st.every(x=>x>0);
    h+=`<button class="unit" data-unit="${u}">
      <span class="u-no ${done?'done':''}">${done?'✓':u}</span>
      <span class="u-title serif">${SECTIONS[curDay][u-1]}</span>
      <span class="u-stars"><b>★ ${s}</b>/ 18<span class="dots">${st.map(x=>`<i class="d${x}"></i>`).join('')}</span></span>
      <span class="u-sub"><span>${ws[0].id}–${ws[9].id}번</span><span class="ar">${esc(ws[0].ar)}</span><span class="ar">${esc(ws[1].ar)}</span></span>
    </button>`;
  }
  h+=`</div>
  <footer>
    <div id="voicebox" class="voicebox"></div>
    <p>진행 상황은 이 브라우저에 저장됩니다. <button class="linkbtn" id="reset">${resetArmed?'한 번 더 누르면 모든 기록이 지워져요':'기록 초기화'}</button></p>
  </footer>`;
  $app.innerHTML=h;
  renderVoiceBox();
  $app.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{curDay=+b.dataset.day;store.day=curDay;save();resetArmed=false;renderHome();});
  $app.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>go(()=>renderUnit(curDay,+b.dataset.unit)));
  document.getElementById('rv').onclick=()=>go(startReview);
  document.getElementById('mix').onclick=()=>go(startMix);
  document.getElementById('reset').onclick=()=>{
    if(!resetArmed){resetArmed=true;renderHome();return;}
    store={stars:{},wrong:{},best:{}};save();resetArmed=false;renderHome();
  };
}

/* ---------- UNIT ---------- */
function renderUnit(d,u){
  const k=`${d}-${u}`, ws=unitWords(d,u), st=getStars(k);
  const best=store.best[k];
  $app.innerHTML=`<div class="topbar"><button class="back" id="back">← Day ${d} 단원 목록</button></div>
  <header class="unit-head"><p>Day ${d}, ${u}단원 (${ws[0].id}–${ws[9].id}번)</p><h2 class="serif">${SECTIONS[d][u-1]}</h2></header>
  <ol class="path">${STAGES.map((s,i)=>{const lock=!unlocked(k,i);const sub=lock?'앞 단계에서 별 1개 이상 받으면 열려요':(i===5&&best?`${s.desc} (최고 ${best}개)`:s.desc);
    return `<li><button class="stage ${lock?'locked':''} ${st[i]?'cleared':''}" data-stage="${i}" ${lock?'disabled':''}>
      <span class="s-num" aria-hidden="true">${lock?'🔒':s.icon}</span>
      <span class="s-txt"><b>${i+1}단계 ${s.name}</b><small>${sub}</small></span>
      <span class="s-st" aria-label="별 ${st[i]}개">${starStr(st[i])}</span></button></li>`}).join('')}</ol>
  <details class="wordlist"><summary>이 단원 단어 10개 미리 보기</summary>
    ${ws.map(w=>`<div class="wr"><span class="wr-n">${w.id}</span><span><span class="ar wr-ar">${esc(w.ar)}</span><span class="wr-m">${esc(w.ko)}</span><span class="wr-p">${esc(w.rom)} / ${esc(w.kp)}</span></span>${sayBtn(w)}</div>`).join('')}
  </details>`;
  document.getElementById('back').onclick=()=>{curDay=d;go(renderHome);};
  $app.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>go(()=>startStage(d,u,+b.dataset.stage)));
}

function startStage(d,u,i){
  const ctx={d,u,key:`${d}-${u}`,words:unitWords(d,u),title:`${i+1}단계 ${STAGES[i].name}`,stage:i};
  ctx.exit=()=>go(()=>renderUnit(d,u));
  ctx.retry=()=>go(()=>startStage(d,u,i));
  ctx.next=i<5?()=>go(()=>startStage(d,u,i+1)):null;
  if(i===0)playCard(ctx);
  else if(i===1)playQuiz(ctx,{type:'a2k',mode:'stage'});
  else if(i===2)playQuiz(ctx,{type:'a2p',mode:'stage'});
  else if(i===3)playQuiz(ctx,{type:'k2a',mode:'stage'});
  else if(i===4)playMatch(ctx);
  else playQuiz(ctx,{type:'mix',mode:'time'});
}
function startReview(){
  const ids=Object.keys(store.wrong).sort((a,b)=>store.wrong[b]-store.wrong[a]).slice(0,20);
  const ctx={words:ids.map(id=>BYID[id]),title:'틀린 단어 복습'};
  ctx.exit=()=>go(renderHome); ctx.retry=Object.keys(store.wrong).length?()=>go(startReview):null;
  playQuiz(ctx,{type:'mix',mode:'review'});
}
function startMix(){
  const ctx={words:shuffle(WORDS).slice(0,20),title:'전체 랜덤 20문제'};
  ctx.exit=()=>go(renderHome); ctx.retry=()=>go(startMix);
  playQuiz(ctx,{type:'mix',mode:'free'});
}

function topbar(ctx,pct,count,time){
  return `<div class="topbar"><button class="back" id="quit" aria-label="그만하기">✕</button>
    <div class="prog ${time?'time':''}" id="pbar"><i style="width:${pct}%"></i></div><span class="count" id="pcount">${count}</span></div>
    <div class="ptitle">${ctx.title}</div>`;
}
function bindQuit(ctx){document.getElementById('quit').onclick=ctx.exit;}

/* ---------- STAGE 1: CARD ---------- */
function playCard(ctx){
  let q=shuffle(ctx.words), done=0; const n=q.length;
  function draw(){
    if(!q.length){setStar(ctx.key,0,3);return result(ctx,{stars:3,score:`${n}개 단어 학습 완료`,missed:[]});}
    const w=q[0];
    $app.innerHTML=topbar(ctx,done/n*100,`${done} / ${n}`)+`
    <div class="flash" id="flash" role="button" tabindex="0" aria-label="카드 뒤집기"><div class="flash-in">
      <div class="face front"><span class="ar big">${esc(w.ar)}</span><span class="hint">탭해서 뜻 보기</span></div>
      <div class="face back"><span class="ar mid">${esc(w.ar)}</span>
        <div class="pron">${esc(w.rom)}<span>${esc(w.kp)}</span></div>
        <div class="mean">${esc(w.ko)}</div><div class="en">${esc(w.en)}</div>
        <div class="ex"><div class="ex-r">${esc(w.exR)}</div><div class="ex-k">${esc(w.exK)}</div></div></div>
    </div></div>
    <div class="sayrow">${sayBtn(w,'🔊')}</div>
    <div class="row2"><button class="btn" id="again">한 번 더 볼래요</button><button class="btn primary" id="ok">외웠어요</button></div>
    <p class="kbd">스페이스: 뒤집기 · ←: 한 번 더 · →: 외웠어요</p>`;
    bindQuit(ctx);
    const f=document.getElementById('flash');
    const flip=()=>f.classList.toggle('on');
    f.onclick=flip;
    const again=()=>{q.push(q.shift());draw();};
    const ok=()=>{q.shift();done++;draw();};
    document.getElementById('again').onclick=again;
    document.getElementById('ok').onclick=ok;
    keyHandler=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();flip();}else if(e.key==='ArrowLeft')again();else if(e.key==='ArrowRight')ok();};
  }
  draw();
}

/* ---------- QUIZ (stages 2-4, time attack, review, mix) ---------- */
const val=(w,t)=>t==='a2k'?w.ko:t==='a2p'?w.rom:w.ar;
function makeQ(w,t){
  const pool=WORDS.filter(x=>x.day===w.day&&x.id!==w.id);
  const seen=new Set([val(w,t)]), opts=[w];
  for(const x of shuffle(pool)){if(opts.length>=4)break;const v=val(x,t);if(seen.has(v))continue;seen.add(v);opts.push(x);}
  return {w,t,opts:shuffle(opts)};
}
function optHTML(x,t){
  if(t==='a2k')return `<span>${esc(x.ko)}</span>`;
  if(t==='a2p')return `<span>${esc(x.rom)}</span><small>${esc(x.kp)}</small>`;
  return `<span class="ar">${esc(x.ar)}</span>`;
}
function promptHTML(q,answered){
  const w=q.w;
  if(q.t==='k2a')return `<p class="qlabel">이 뜻의 아랍어는?</p><div class="cartouche"><span class="ko">${esc(w.ko)}</span><span class="en">${esc(w.en)}</span></div>`;
  const label=q.t==='a2k'?'이 단어의 뜻은?':'이 단어는 어떻게 읽을까요?';
  const showSay=q.t==='a2k'||answered;
  return `<p class="qlabel">${label}</p><div class="cartouche"><span class="ar">${esc(w.ar)}</span></div>${showSay?`<div class="sayrow">${sayBtn(w)}</div>`:''}`;
}
function playQuiz(ctx,opt){
  const timeMode=opt.mode==='time';
  const list=timeMode?null:shuffle(ctx.words);
  let idx=0, score=0, answered=0, missed=[], lastId=null, ended=false;
  const n=list?list.length:0;
  const deadline=Date.now()+60000;
  if(timeMode){
    timers.push(setInterval(()=>{
      const left=Math.max(0,deadline-Date.now());
      const bar=document.querySelector('#pbar i'), c=document.getElementById('pcount');
      if(bar)bar.style.width=(left/600)+'%';
      if(c)c.textContent=Math.ceil(left/1000)+'초';
      if(left<=0&&!ended){ended=true;finish();}
    },100));
  }
  function nextWord(){
    if(!timeMode)return list[idx];
    let w; do{w=pick(ctx.words);}while(ctx.words.length>1&&w.id===lastId);
    lastId=w.id; return w;
  }
  function draw(){
    if(ended)return;
    if(!timeMode&&idx>=n)return finish();
    const w=nextWord();
    const t=opt.type==='mix'?pick(['a2k','a2p','k2a']):opt.type;
    const q=makeQ(w,t);
    const count=timeMode?`${Math.ceil(Math.max(0,deadline-Date.now())/1000)}초`:`${idx+1} / ${n}`;
    const pct=timeMode?Math.max(0,deadline-Date.now())/600:idx/n*100;
    $app.innerHTML=topbar(ctx,pct,count,timeMode)+(timeMode?`<p class="qlabel">맞힌 개수 <b id="sc">${score}</b></p>`:'')+
      `<div id="prompt">${promptHTML(q,false)}</div>
      <div class="opts">${q.opts.map((x,i)=>`<button class="opt ${t==='k2a'?'aropt':''}" data-i="${i}"><span class="k">${i+1}</span>${optHTML(x,t)}</button>`).join('')}</div>
      <div id="fb"></div>`;
    bindQuit(ctx);
    let locked=false;
    const choose=i=>{
      if(locked||ended)return; locked=true;
      const chosen=q.opts[i], ok=chosen.id===w.id;
      answered++;
      $app.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(q.opts[j].id===w.id)b.classList.add('right');else if(j===i)b.classList.add('wrong');});
      if(ok){score++; if(opt.mode==='review')fixWrong(w.id);}
      else{addWrong(w.id); missed.push(w);}
      if(q.t==='a2p')document.getElementById('prompt').innerHTML=promptHTML(q,true);
      if(timeMode){const s=document.getElementById('sc');if(s)s.textContent=score;later(draw,ok?350:900);return;}
      document.getElementById('fb').innerHTML=`<div class="reveal ${ok?'good':'bad'}" role="status">
        <div class="rv-h">${ok?'정답이에요':'정답은 이거예요'}</div>
        <div class="rv-w"><span class="ar">${esc(w.ar)}</span><b>${esc(w.rom)}</b> (${esc(w.kp)}) ${esc(w.ko)}</div>
        <div class="rv-ex">${esc(w.exR)} / ${esc(w.exK)}</div></div>
        ${ok?'':`<div class="nextrow"><button class="btn primary" id="nx">다음 문제</button></div>`}`;
      const advance=()=>{idx++;draw();};
      if(ok)later(advance,1000);
      else{document.getElementById('nx').onclick=advance;document.getElementById('nx').focus();keyHandler=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();advance();}};}
    };
    $app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.i));
    keyHandler=e=>{const k=+e.key;if(k>=1&&k<=4)choose(k-1);};
  }
  function finish(){
    timers.forEach(t=>{clearTimeout(t);clearInterval(t)});timers=[];keyHandler=null;
    if(timeMode){
      const stars=score>=15?3:score>=10?2:score>=6?1:0;
      if(ctx.key){setStar(ctx.key,5,stars); if(score>(store.best[ctx.key]||0)){store.best[ctx.key]=score;save();}}
      return result(ctx,{stars,score:`60초 동안 ${score}개 정답 (시도 ${answered}번)`,missed,timeMsg:true});
    }
    const pct=score/n;
    if(opt.mode==='stage'){
      const stars=pct>=.9?3:pct>=.75?2:pct>=.6?1:0;
      setStar(ctx.key,ctx.stage,stars);
      return result(ctx,{stars,score:`${n}문제 중 ${score}개 정답`,missed});
    }
    return result(ctx,{stars:null,score:`${n}문제 중 ${score}개 정답`,missed,
      msg:opt.mode==='review'?(Object.keys(store.wrong).length?`아직 ${Object.keys(store.wrong).length}개 단어가 복습 목록에 남아 있어요. 맞힐수록 목록에서 빠집니다.`:'복습 목록을 모두 비웠어요!'):null});
  }
  draw();
}

/* ---------- STAGE 5: MATCH ---------- */
function playMatch(ctx){
  const ws=shuffle(ctx.words), chunks=[];
  for(let i=0;i<ws.length;i+=5)chunks.push(ws.slice(i,i+5));
  let round=0, mistakes=0;
  function draw(){
    const c=chunks[round], L=shuffle(c), R=shuffle(c);
    let selL=null, selR=null, matched=0, busy=false;
    $app.innerHTML=topbar(ctx,round/chunks.length*100,`${round+1} / ${chunks.length}판`)+
      `<p class="qlabel">아랍어와 뜻이 맞는 짝을 차례로 누르세요 (실수 ${mistakes}번)</p>
      <div class="mgrid"><div class="mcol">${L.map(w=>`<button class="mi" data-l="${w.id}"><span class="ar">${esc(w.ar)}</span></button>`).join('')}</div>
      <div class="mcol">${R.map(w=>`<button class="mi" data-r="${w.id}">${esc(w.ko)}</button>`).join('')}</div></div>`;
    bindQuit(ctx);
    const check=()=>{
      if(!selL||!selR)return;
      const a=selL,b=selR; selL=selR=null;
      if(a.dataset.l===b.dataset.r){
        speak(BYID[a.dataset.l].ar);
        [a,b].forEach(x=>{x.classList.remove('sel');x.classList.add('ok');x.disabled=true;});
        if(++matched===c.length){round++; later(()=>round>=chunks.length?finish():draw(),500);}
      }else{
        mistakes++; busy=true;
        document.querySelector('.qlabel').textContent=`아랍어와 뜻이 맞는 짝을 차례로 누르세요 (실수 ${mistakes}번)`;
        [a,b].forEach(x=>{x.classList.remove('sel');x.classList.add('no');});
        later(()=>{[a,b].forEach(x=>x.classList.remove('no'));busy=false;},450);
      }
    };
    $app.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{if(busy)return;if(selL)selL.classList.remove('sel');selL=b;b.classList.add('sel');check();});
    $app.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{if(busy)return;if(selR)selR.classList.remove('sel');selR=b;b.classList.add('sel');check();});
  }
  function finish(){
    const stars=mistakes<=1?3:mistakes<=4?2:1;
    setStar(ctx.key,4,stars);
    result(ctx,{stars,score:`10쌍 완성, 실수 ${mistakes}번`,missed:[]});
  }
  draw();
}

/* ---------- RESULT ---------- */
const MSG=['조금만 더! 60% 이상 맞히면 다음 단계가 열려요.','통과! 틀린 단어만 한 번 더 보고 가요.','쿠와이이스 아위! 아주 잘했어요.','마브루크! 완벽해요.'];
const TMSG=['6개 이상 맞히면 별을 받아요. 카드로 한 번 더 훑고 도전해 보세요.','좋은 출발! 10개를 넘기면 별 2개예요.','빨라요! 15개를 넘기면 별 3개예요.','이 단원은 완전히 내 것이 됐어요.'];
function result(ctx,r){
  keyHandler=null;
  const uniq=[...new Map(r.missed.map(w=>[w.id,w])).values()];
  const msg=r.msg||(r.stars==null?'틀린 단어는 자동으로 복습 목록에 들어가요.':(r.timeMsg?TMSG:MSG)[r.stars]);
  const canNext=ctx.next&&r.stars>0;
  $app.innerHTML=`<div class="topbar"><button class="back" id="quit">← ${ctx.key?'단원으로':'처음으로'}</button></div>
  <section class="result" aria-live="polite">
    <h2 class="r-title serif">${ctx.title}</h2>
    ${r.stars!=null?`<div class="r-stars" aria-label="별 ${r.stars}개">${[1,2,3].map(i=>`<span class="${i<=r.stars?'on':''}">★</span>`).join('')}</div>`:''}
    <div class="r-score">${r.score}</div>
    <p class="r-msg">${msg}</p>
    <div class="r-btns">
      ${ctx.retry?`<button class="btn" id="retry">다시 하기</button>`:''}
      ${canNext?`<button class="btn gold" id="next">${ctx.stage+2}단계 ${STAGES[ctx.stage+1].name} 시작</button>`:''}
      ${!canNext&&ctx.key?`<button class="btn primary" id="unit">단원으로</button>`:''}
    </div>
    ${uniq.length?`<div class="missed"><h4>틀린 단어 ${uniq.length}개</h4>${uniq.map(w=>`<div class="wr"><span class="wr-n">${w.id}</span><span><span class="ar wr-ar">${esc(w.ar)}</span><span class="wr-m">${esc(w.ko)}</span><span class="wr-p">${esc(w.rom)} / ${esc(w.kp)}</span></span>${sayBtn(w)}</div>`).join('')}</div>`:''}
  </section>`;
  document.getElementById('quit').onclick=ctx.exit;
  const rt=document.getElementById('retry'); if(rt)rt.onclick=ctx.retry;
  const nx=document.getElementById('next'); if(nx)nx.onclick=ctx.next;
  const un=document.getElementById('unit'); if(un)un.onclick=ctx.exit;
}

renderHome();
</script>
</body>
</html>
